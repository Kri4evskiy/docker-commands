services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    restart: always
  api:
    build: ./api
    ports:
      - "5555:5000"
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: time_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    ports:
      - "3306:3306"

  dbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: always
    ports:
      - "8888:8080"
