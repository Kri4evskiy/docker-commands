services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - /app/node_modules
      - ./frontend:/app
  api:
    build: ./api
    ports:
      - "5555:5000"
    restart: always
    volumes:
      - /app/node_modules
      - ./api:/app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DB: time_db
  mysql:
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: time_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  dbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: always
    ports:
      - "8888:8080"

volumes:
  mysql_data:
